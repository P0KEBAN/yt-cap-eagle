<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="pageTitle">yt-cap Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page">
      <h1 data-i18n="pageTitle">yt-cap Settings</h1>

      <form id="settings-form" class="settings-form">
        <label>
          <span data-i18n="eagleHost">Eagle API host</span>
          <input id="eagle-host" name="eagleHost" autocomplete="off" />
        </label>

        <label>
          <span data-i18n="eaglePort">Eagle API port</span>
          <input
            id="eagle-port"
            name="eaglePort"
            inputmode="numeric"
            autocomplete="off"
          />
        </label>

        <label>
          <span data-i18n="defaultFolderId">Default folder ID</span>
          <input
            id="default-folder-id"
            name="defaultFolderId"
            autocomplete="off"
          />
        </label>

        <p class="hint" data-i18n="folderHint">
          Right-click a folder in Eagle, copy its ID, and paste it here. If left
          empty, saving with Enter also goes to the inbox.
        </p>

        <label>
          <span data-i18n="language">Language</span>
          <select id="language" name="language">
            <option value="auto" data-i18n="languageAuto">
              Auto (follow browser)
            </option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>

        <div class="actions">
          <button type="submit" data-i18n="save">Save</button>
          <button id="test-connection" type="button" data-i18n="testConnection">
            Test connection
          </button>
        </div>

        <p id="status" class="status" role="status"></p>
      </form>
    </main>

    <script type="module" src="../dist/options.js"></script>
  </body>
</html>
